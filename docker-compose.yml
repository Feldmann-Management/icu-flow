services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: icuflow
      POSTGRES_USER: icuflow
      POSTGRES_PASSWORD: icuflow
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icuflow -d icuflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
