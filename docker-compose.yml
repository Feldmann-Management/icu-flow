services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: icuflow
      POSTGRES_USER: icuflow
      POSTGRES_PASSWORD: icuflow
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icuflow -d icuflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://icuflow:icuflow@postgres:5432/icuflow
      WORK_DIR: /var/lib/icu-flow/work
    volumes:
      - worker-work:/var/lib/icu-flow/work
    stop_grace_period: 30s
    profiles:
      - full

volumes:
  postgres-data:
  worker-work:
